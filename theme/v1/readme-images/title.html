<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>README title image</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 640px; overflow: hidden; font-family: var(--body); color: var(--ink); position: relative;
    background: radial-gradient(900px 520px at 18% 30%, var(--glow-1), transparent 60%),
                radial-gradient(700px 500px at 86% 90%, var(--glow-2), transparent 60%),
                linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%); }
  /* Optional dot grid (FLODE: looks like its canvas). */
  body.grid::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
    background-image: radial-gradient(circle, var(--frame) 1.2px, transparent 1.4px); background-size: 22px 22px; }
  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 74px; height: 74px; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.22); }
  .brand h1 { font-family: var(--display); font-weight: 800; font-size: 68px; letter-spacing: -0.03em; line-height: 1; color: var(--ink); }
  .eyebrow { margin-top: 18px; font-family: var(--mono); font-weight: 500; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-text); }
  .lead { margin-top: 26px; font-family: var(--display); font-weight: 700; font-size: 38px; letter-spacing: -0.02em; line-height: 1.08; color: var(--ink); }
  .lead em { font-style: normal; color: var(--accent-text); }
  .sub { margin-top: 16px; font-size: 18px; line-height: 1.45; color: var(--ink-2); max-width: 440px; }
  .pills { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: 0.02em; padding: 7px 12px; border-radius: 999px;
    background: var(--pill-bg); border: 1px solid var(--pill-line); color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .pill.v i { background: var(--accent-2); }
  /* Screenshot in a window frame, bleeding off the right/bottom edge. Strips skip uninteresting parts of the source. */
  .shot { position: absolute; border-radius: 18px; overflow: hidden; border: 1px solid var(--frame); box-shadow: var(--shadow); background: var(--win);
    transform: perspective(1800px) rotateY(-6deg) rotateX(2deg); transform-origin: left center; }
  .shot.flat { transform: perspective(1800px) rotateY(-4deg); }
  .bar { height: 34px; display: flex; align-items: center; gap: 7px; padding: 0 14px; background: var(--bar); border-bottom: 1px solid var(--frame); }
  .bar i { width: 11px; height: 11px; border-radius: 50%; }
  .bar i:nth-child(1){ background:#ff5f57 } .bar i:nth-child(2){ background:#febc2e } .bar i:nth-child(3){ background:#28c840 }
  .bar span { margin-left: 10px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .strip { position: relative; overflow: hidden; width: 100%; }
  .strip img { position: absolute; left: 0; height: auto; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand"><img id="logo" alt=""><h1 id="name"></h1></div>
    <div class="eyebrow" id="eyebrow"></div>
    <div class="lead" id="lead"></div>
    <div class="sub" id="sub"></div>
    <div class="pills" id="pills"></div>
  </div>
  <div class="shot" id="shot"></div>
<script>
  // The renderer injects window.CFG = { ...title config, colors: {light, dark}, fonts, dark, base } (see render.mjs).
  const T = window.CFG, dark = T.dark, C = dark ? T.colors.dark : T.colors.light;
  if (T.fonts.google) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = T.fonts.google; document.head.appendChild(l); }
  const root = document.documentElement.style;
  const vars = { bg: C.bg, 'bg-2': C.bg2, ink: C.ink, 'ink-2': C.ink2, 'ink-3': C.ink3, 'accent-text': C.accentText, accent: C.accent, 'accent-2': C.accent2,
    'glow-1': C.glow1, 'glow-2': C.glow2, frame: C.frame, 'pill-bg': C.pillBg, 'pill-line': C.pillLine, win: C.win, bar: C.bar || 'transparent',
    shadow: dark ? '0 30px 80px rgba(0,0,0,0.55), 0 8px 24px rgba(0,0,0,0.35)' : '0 30px 80px rgba(11,18,32,0.22), 0 8px 24px rgba(11,18,32,0.10)',
    display: T.fonts.display, body: T.fonts.body, mono: T.fonts.mono };
  Object.entries(vars).forEach(([k, v]) => root.setProperty('--' + k, v));
  if (T.grid) document.body.classList.add('grid');
  document.getElementById('logo').src = T.base + T.logo;
  document.getElementById('name').textContent = T.name;
  document.getElementById('eyebrow').textContent = T.eyebrow;
  document.getElementById('lead').innerHTML = T.lead;
  document.getElementById('sub').textContent = T.sub;
  document.getElementById('pills').innerHTML = (T.pills || []).map(([t, v]) => '<span class="pill' + (v ? ' v' : '') + '"><i></i>' + t + '</span>').join('');
  const sh = T.shot, el = document.getElementById('shot');
  el.style.left = sh.left + 'px'; el.style.top = sh.top + 'px'; el.style.width = Math.round(sh.winW * sh.s) + 'px';
  if (sh.flat) el.classList.add('flat');
  let html = sh.bar ? '<div class="bar"><i></i><i></i><i></i><span>' + sh.bar + '</span></div>' : '';
  sh.strips.forEach(([y0, y1]) => {
    html += '<div class="strip" style="height:' + ((y1 - y0) * sh.s) + 'px"><img src="' + T.base + (dark ? sh.dark : sh.light) + '" style="width:' + (sh.srcW * sh.s) + 'px;top:' + (-y0 * sh.s) + 'px" alt=""></div>';
  });
  el.innerHTML = html;
</script>
</body>
</html>
