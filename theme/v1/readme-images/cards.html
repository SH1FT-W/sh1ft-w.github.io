<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>README feature cards</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 928px; font-family: var(--body); color: var(--ink); background: transparent; padding: 2px; }
  /* Two columns of horizontal cards: icon left, title and one line right, like the feature rows on the website.
     928 px is the width GitHub gives a README, so the text keeps its size. */
  .grid { display: grid; grid-template-columns: repeat(var(--cols, 2), 1fr); gap: 12px; }
  .card { display: flex; gap: 14px; padding: 16px 18px; border-radius: 18px; background: var(--card); border: 1px solid var(--frame); }
  .ic { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--tint); display: flex; align-items: center; justify-content: center; }
  .ic.img { background: none; } .ic.img img { width: 40px; height: 40px; border-radius: 10px; display: block; }
  .ic i { display: block; width: 22px; height: 22px; background: var(--accent-text); -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
  .t { font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: -0.01em; line-height: 1.25; color: var(--ink); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .t s { text-decoration: none; font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: 0.02em; color: var(--accent-text); background: var(--tint); padding: 2px 7px; border-radius: 999px; }
  .x { margin-top: 5px; font-size: 14px; line-height: 1.45; color: var(--ink-2); }
</style>
</head>
<body>
  <div class="grid" id="grid"></div>
<script>
  // The renderer injects window.CFG = { cards: [{ icon, title, text, ver }], cols, colors: {light, dark}, fonts, dark }.
  // Icons are Material Design Icons by name (the set Home Assistant uses), loaded from the jsDelivr CDN.
  const T = window.CFG, dark = T.dark, C = dark ? T.colors.dark : T.colors.light;
  if (T.fonts.google) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = T.fonts.google; document.head.appendChild(l); }
  const root = document.documentElement.style;
  Object.entries({ ink: C.ink, 'ink-2': C.ink2, 'accent-text': C.accentText, card: dark ? C.win : '#ffffff', frame: C.frame,
    tint: dark ? 'rgba(255,255,255,0.08)' : C.glow1, display: T.fonts.display, body: T.fonts.body, mono: T.fonts.mono }).forEach(([k, v]) => root.setProperty('--' + k, v));
  if (T.cols) root.setProperty('--cols', T.cols);
  // An icon with a slash or URL is a picture (a project's own app icon); a bare name is a Material Design Icon.
  const icon = (c) => /[\/]/.test(c.icon) ? '<div class="ic img"><img src="' + c.icon + '" alt=""></div>'
    : '<div class="ic"><i style="--m:url(\'https://cdn.jsdelivr.net/npm/@mdi/svg@7.4.47/svg/' + c.icon + '.svg\')"></i></div>';
  document.getElementById('grid').innerHTML = T.cards.map((c) =>
    '<div class="card">' + icon(c) + '<div>'
    + '<div class="t">' + c.title + (c.ver ? '<s>' + c.ver + '</s>' : '') + '</div><div class="x">' + c.text + '</div></div></div>').join('');
</script>
</body>
</html>
